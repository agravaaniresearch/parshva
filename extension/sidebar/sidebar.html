<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parshva</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button id="btn-history" class="icon" title="History" aria-label="History">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div class="brand">Parshva</div>
      <button id="btn-new" class="icon" title="New chat" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="btn-settings" class="icon" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></svg>
      </button>
    </header>

    <div class="modelbar">
      <div class="modelpick">
        <button id="model-btn" class="modelbtn" type="button" aria-haspopup="listbox" aria-expanded="false" title="Choose provider and model">
          <span class="mtxt"><span class="mprov"></span><span class="mname"></span></span>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="model-menu" class="modelmenu" role="listbox" hidden></div>
      </div>
      <button id="btn-page" class="chip" aria-pressed="false" title="Send the current page's text along with your message">Page</button>
    </div>

    <div id="pagebar" class="pagebar" hidden></div>

    <main id="messages" aria-live="polite"></main>

    <section id="history" class="history" hidden>
      <div class="history-head">
        <strong>History</strong>
        <button id="btn-history-close" class="icon" aria-label="Close history">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <ul id="history-list"></ul>
    </section>

    <div id="actionbar" class="actionbar" hidden>
      <button id="btn-copy" class="copy-main" type="button"><span class="ico"></span><span class="lbl">Copy</span></button>
      <button id="btn-plain" class="ghost-btn" type="button"><span class="lbl">Plain text</span></button>
      <button id="btn-retry" class="ghost-btn" type="button" aria-label="Retry"><span class="ico"></span></button>
    </div>

    <div id="notice" class="notice" hidden></div>

    <footer class="composer">
      <textarea id="input" rows="1" placeholder="Ask anything" aria-label="Message"></textarea>
      <button id="btn-send" class="send" title="Send" aria-label="Send"></button>
    </footer>
  </div>
  <script type="module" src="sidebar.js"></script>
</body>
</html>
