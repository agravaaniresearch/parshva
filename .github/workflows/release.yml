name: Build and sign XPI

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "package.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint

      # Every successful push gets a fresh, unique version (AMO rejects reused versions).
      # The committed manifest keeps its major.minor; the patch is the CI run number.
      - name: Set version
        id: v
        run: |
          BASE=$(jq -r .version extension/manifest.json | cut -d. -f1-2)
          VERSION="$BASE.${{ github.run_number }}"
          jq --arg v "$VERSION" '.version = $v' extension/manifest.json > manifest.tmp
          mv manifest.tmp extension/manifest.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sign with Mozilla (unlisted, automatic)
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        run: |
          npx web-ext sign \
            --source-dir extension \
            --artifacts-dir dist \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"

      - name: Build unsigned package (only when no signing keys are set)
        if: env.AMO_JWT_ISSUER == '' || env.AMO_JWT_SECRET == ''
        run: |
          npm run build
          echo "::warning::AMO_JWT_ISSUER / AMO_JWT_SECRET are not set, so this build is UNSIGNED and will not install in regular Firefox."

      - name: Keep unsigned build as a workflow artifact (no release)
        if: env.AMO_JWT_ISSUER == '' || env.AMO_JWT_SECRET == ''
        uses: actions/upload-artifact@v4
        with:
          name: parshva-unsigned
          path: dist/*.zip

      - name: Publish release
        if: env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          if ls dist/*.xpi >/dev/null 2>&1; then
            cp "$(ls dist/*.xpi | head -n1)" dist/parshva.xpi
            ASSETS="dist/parshva.xpi"
            NOTES="Signed build. Download parshva.xpi, then in Firefox open about:addons, click the gear icon and choose Install Add-on From File."
          else
            cp "$(ls dist/*.zip | head -n1)" dist/parshva-unsigned.zip
            ASSETS="dist/parshva-unsigned.zip"
            NOTES="UNSIGNED build (signing keys missing). Only loads in Firefox Developer Edition or Nightly."
          fi
          gh release create "v$VERSION" $ASSETS \
            --title "Parshva $VERSION" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA"
